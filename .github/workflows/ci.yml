name: Addons CI

on:
  push:
    branches: [v2/addons, main]
  pull_request:
    branches: [v2/addons, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Addons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addons
        uses: actions/checkout@v7

      - name: Checkout lumi
        uses: actions/checkout@v7
        with:
          repository: lumi-devs/Lumi
          ref: v2/develop
          path: .lumi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install lumi dependencies
        working-directory: .lumi
        run: |
          bun install --frozen-lockfile
          bun run db:generate

      - name: Link node_modules
        run: ln -sfn .lumi/node_modules node_modules

      - name: Validate manifests
        run: bun scripts/validate.ts

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
