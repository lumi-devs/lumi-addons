name: Addons CI

on:
  push:
    branches: [v2/addons, main, master]
  pull_request:
    branches: [v2/addons, main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Addons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addons
        uses: actions/checkout@v7

      - name: Checkout lumi
        uses: actions/checkout@v7
        with:
          repository: lumi-devs/lumi
          ref: develop/v2
          path: .lumi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install lumi dependencies
        working-directory: .lumi
        run: |
          bun install --frozen-lockfile
          bun run db:generate

      - name: Link node_modules
        run: |
          ln -sfn .lumi/node_modules node_modules

      - name: Run Addons Validator
        run: bun scripts/validate.ts

      - name: Run Tests
        run: bun run test
