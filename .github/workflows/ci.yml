name: Addons CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: CI / typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addons
        uses: actions/checkout@v7

      - name: Checkout lumi core
        uses: actions/checkout@v7
        with:
          repository: lumi-devs/lumi
          path: ../lumi

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install lumi core dependencies
        working-directory: ../lumi
        run: nix-shell --run "bun install --frozen-lockfile"

      - name: Link addons against lumi core
        run: LUMI_PATH=../lumi nix-shell --run "sh scripts/setup.sh"

      - name: Run Typecheck
        run: nix-shell --run "bun run typecheck"

  lint:
    name: CI / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addons
        uses: actions/checkout@v7

      - name: Checkout lumi core
        uses: actions/checkout@v7
        with:
          repository: lumi-devs/lumi
          path: ../lumi

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install lumi core dependencies
        working-directory: ../lumi
        run: nix-shell --run "bun install --frozen-lockfile"

      - name: Link addons against lumi core
        run: LUMI_PATH=../lumi nix-shell --run "sh scripts/setup.sh"

      - name: Run Linter
        run: nix-shell --run "bun run lint"
